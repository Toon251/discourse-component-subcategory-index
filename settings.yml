plugin_outlet:
  default: "discovery-above"
hide_on_mobile:
  default: false
categoryIds: {
    type: list,
    description: "List of category IDs",
    default: ""
}
page_navigate: true
page_size: {
  type: integer,
  description: "Category per page",
  default: 5
}
page_size_options: {
    type: list,
    description: "List of page size options",
    default: ["5", "10", "20", "50", "100"]
}